name: Generate Korean README

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/translate_readme.py
      - .github/workflows/translate-readme.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: korean-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Markdown translator
        run: python -m unittest discover -s scripts -p 'test_translate_readme.py' -v
      - name: Determine whether a new line needs automatic translation
        id: model
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          overrides = json.loads(Path("scripts/readme_ko_overrides.json").read_text(encoding="utf-8"))
          fenced = False
          unknown = []
          for line in Path("README.md").read_text(encoding="utf-8").splitlines():
              if line.strip().startswith(("\\x60\\x60\\x60", "~~~")):
                  fenced = not fenced
                  continue
              if not fenced and line.strip() and line not in overrides and not line.lstrip().startswith("<!--"):
                  unknown.append(line)
          print("required=" + ("true" if unknown else "false"))
          print("unreviewed_lines=" + str(len(unknown)))
          PY
      - name: Install offline machine translation for newly changed English text
        if: steps.model.outputs.required == 'true'
        run: python -m pip install 'argostranslate>=1.9,<2'
      - name: Regenerate README_KO.md
        run: python scripts/translate_readme.py
      - name: Commit updated Korean translation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README_KO.md && test -z "$(git ls-files --others --exclude-standard README_KO.md)"; then
            echo 'Korean README is already synchronized' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README_KO.md
          git commit -m 'docs: automatically synchronize Korean README [skip ci]'
          git push origin HEAD:main
