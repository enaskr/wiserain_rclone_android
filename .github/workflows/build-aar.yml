name: Build wiserain/rclone Android AAR
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional upstream release tag'
        required: false
        type: string
      force:
        description: 'Rebuild already published release'
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/build-aar.yml', 'scripts/**']
permissions:
  contents: read
concurrency:
  group: wiserain-rclone-aar
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve upstream release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          FORCE_BUILD: ${{ inputs.force }}
        run: bash scripts/resolve-release.sh
  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: wiserain/rclone
          ref: ${{ needs.resolve.outputs.sha }}
          path: rclone
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: rclone/go.mod
          cache-dependency-path: rclone/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already include Android SDK command-line tools.
      # Avoid android-actions/setup-android@v3, which tries to install the removed
      # "tools" package and fails with "Failed to find package 'tools'".
      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" || ! -d "$sdk_root" ]]; then
            echo "::error::Android SDK not found on GitHub runner"
            exit 1
          fi
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::sdkmanager is not available on PATH"
            exit 1
          fi
          echo "Using sdkmanager: $(command -v sdkmanager)"
          # License command may return a nonzero status after all licenses are
          # accepted; the subsequent install is the authoritative check.
          yes | sdkmanager --sdk_root="$sdk_root" --licenses > /dev/null || true
          sdkmanager --sdk_root="$sdk_root" --install 'platforms;android-35' 'ndk;27.2.12479018'
          ndk="$sdk_root/ndk/27.2.12479018"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_NDK_ROOT=$ndk"
          } >> "$GITHUB_ENV"
          echo "Android NDK: $ndk" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and verify AAR
        working-directory: rclone
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: bash ../builder/scripts/build-aar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rclone-${{ needs.resolve.outputs.tag }}-android-aar
          path: rclone/dist/
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: [resolve, build]
    if: needs.resolve.outputs.build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rclone-${{ needs.resolve.outputs.tag }}-android-aar
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          release="aar-$RELEASE_TAG"
          if gh release view "$release" >/dev/null 2>&1; then
            echo "Already published $release" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$release" dist/*.aar dist/SHA256SUMS dist/BUILD_INFO.txt dist/AAR_CONTENTS.txt             --title "Android AAR for wiserain/rclone $RELEASE_TAG"             --notes "Upstream: wiserain/rclone $RELEASE_TAG, commit $RELEASE_SHA"
