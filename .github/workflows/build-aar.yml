name: Build wiserain/rclone Android AAR
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional upstream release tag'
        required: false
        type: string
      force:
        description: 'Rebuild an already published release with updated ckReader bindings'
        required: false
        type: boolean
        default: false
  # GitHub cron is UTC; Asia/Seoul (UTC+9) has no daylight saving time.
  schedule:
    - cron: '4 19 * * *' # 04:04 KST (next calendar day)
    - cron: '12 3 * * *' # 12:12 KST
  push:
    branches: [main]
    paths:
      - .github/workflows/build-aar.yml
      - scripts/build-aar.sh
      - scripts/resolve-release.sh
      - scripts/ckreader_range.go
      - scripts/verify-aar.py
permissions:
  contents: read
concurrency:
  group: wiserain-rclone-aar
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      build: ${{ steps.resolve.outputs.build }}
      force: ${{ steps.resolve.outputs.force }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve upstream release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          # Preserve version-based skipping on schedules; rebuild changed
          # native builder code when pushed to main, or when manually forced.
          FORCE_BUILD: ${{ github.event_name == 'push' || inputs.force }}
        run: bash scripts/resolve-release.sh
  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: wiserain/rclone
          ref: ${{ needs.resolve.outputs.sha }}
          path: rclone
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: rclone/go.mod
          cache-dependency-path: rclone/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already include Android SDK command-line tools.
      # Avoid android-actions/setup-android@v3, which tries to install the removed
      # "tools" package and fails with "Failed to find package 'tools'".
      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" || ! -d "$sdk_root" ]]; then
            echo "::error::Android SDK not found on GitHub runner"
            exit 1
          fi
          # The hosted image ships sdkmanager in cmdline-tools, but it is not
          # necessarily on PATH until a separate setup action configures it.
          sdkmanager_bin=""
          for candidate in "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
                           "$sdk_root"/cmdline-tools/*/bin/sdkmanager \
                           "$sdk_root/tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then
              sdkmanager_bin="$candidate"
              break
            fi
          done
          if [[ -z "$sdkmanager_bin" ]]; then
            echo "::error::sdkmanager not found under $sdk_root"
            ls -la "$sdk_root/cmdline-tools" || true
            exit 1
          fi
          echo "Using sdkmanager: $sdkmanager_bin"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          # License command can get SIGPIPE from yes after its prompts finish.
          # A subsequent install and NDK executable check validate success.
          yes | "$sdkmanager_bin" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdkmanager_bin" --sdk_root="$sdk_root" --install 'platforms;android-35' 'ndk;27.2.12479018'
          ndk="$sdk_root/ndk/27.2.12479018"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_NDK_ROOT=$ndk"
          } >> "$GITHUB_ENV"
          echo "Android NDK: $ndk" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and verify AAR
        working-directory: rclone
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: bash ../builder/scripts/build-aar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rclone-${{ needs.resolve.outputs.tag }}-android-aar
          path: rclone/dist/
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: [resolve, build]
    if: needs.resolve.outputs.build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rclone-${{ needs.resolve.outputs.tag }}-android-aar
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          FORCE_BUILD: ${{ needs.resolve.outputs.force }}
        run: |
          set -euo pipefail
          release="aar-$RELEASE_TAG"
          (cd dist && sha256sum -c SHA256SUMS)
          files=(dist/*.aar dist/SHA256SUMS dist/BUILD_INFO.txt dist/AAR_CONTENTS.txt dist/AAR_VERIFICATION.json)
          for file in "${files[@]}"; do test -s "$file"; done
          if gh release view "$release" >/dev/null 2>&1; then
            if [[ "$FORCE_BUILD" != true ]]; then
              echo "Already published $release" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gh release upload "$release" "${files[@]}" --clobber
            gh release edit "$release" --notes "Upstream: wiserain/rclone $RELEASE_TAG, commit $RELEASE_SHA. Rebuilt with ckReader stat/range JNI and 16 KiB ELF validation for all ABIs."
            echo "Replaced AAR assets in $release" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$release" "${files[@]}" \
            --title "Android AAR for wiserain/rclone $RELEASE_TAG" \
            --notes "Upstream: wiserain/rclone $RELEASE_TAG, commit $RELEASE_SHA. Includes ckReader stat/range JNI and 16 KiB ELF validation."
